<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri MIDI</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="encabezado">
      <h1>Tauri MIDI</h1>
      <p
        id="indicador-estado"
        class="estado estado-desconectado"
        aria-live="polite"
      >
        Desconectado
      </p>
    </header>

    <main class="contenedor">
      <section
        id="panel-conexion"
        class="panel panel-conexion"
        role="tabpanel"
        aria-labelledby="tab-conexion"
      >
        <p class="subtitulo">
          Elegí un puerto de entrada y uno de salida para ver los mensajes MIDI
          que pasan por la aplicación.
        </p>

        <div class="campo">
          <label for="select-puerto-entrada">Puerto de entrada</label>
          <select id="select-puerto-entrada"></select>
        </div>

        <div class="campo">
          <label for="select-puerto-salida">Puerto de salida</label>
          <select id="select-puerto-salida"></select>
        </div>

        <div class="fila-botones">
          <button id="boton-actualizar-puertos" type="button">
            Actualizar puertos
          </button>
          <button id="boton-conectar" type="button">Conectar</button>
          <button id="boton-desconectar" type="button" disabled>
            Desconectar
          </button>
        </div>

        <p id="mensaje-conexion" class="mensaje-conexion"></p>
      </section>

      <section
        id="panel-log"
        class="panel panel-log"
        role="tabpanel"
        aria-labelledby="tab-log"
      >
        <div class="encabezado-log">
          <h2>Mensajes MIDI</h2>
          <button id="boton-limpiar-log" type="button">Limpiar</button>
        </div>
        <div id="lista-mensajes" class="lista-mensajes"></div>
      </section>
    </main>

    <div class="barra-tabs" role="tablist" aria-label="Secciones">
      <button
        id="tab-conexion"
        type="button"
        role="tab"
        aria-controls="panel-conexion"
      >
        Conexión
      </button>
      <button id="tab-log" type="button" role="tab" aria-controls="panel-log">
        Log
      </button>
    </div>
  </body>
</html>
